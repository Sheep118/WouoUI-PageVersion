# WouoUI 字体转换配置文件
# Font Conversion Configuration

# 扫描配置
scan:
  # 是否根据扫描结果自动回写 WouoUI_font.h 的中文相关宏
  auto_write_font_macros: true

  # 文件无BOM时优先尝试的编码（按顺序严格解码）
  # 都失败后再使用 chardet 猜测
  bomless_preferred_encodings:
    - utf-8
    - gb2312

  # 扫描入口（可同时配置文件和目录，路径相对 Scripts 目录）
  scan_paths:
    - ../Csource

  # 只扫描这些扩展名
  include_exts:
    - .c
    - .h

  # 排除路径（文件或目录，相对 Scripts 目录）
  exclude_paths:
    - ../Csource/font

  # 按函数名排除其参数字符串（典型：printf("...")）
  # 匹配规则：字符串前缀末尾满足 func_name( ...
  exclude_functions:
    - printf
    - fprintf
    - snprintf

  # 按“字符串前缀上下文”正则排除（可选）
  # 注意：这是 Python 正则，建议锚定到前缀末尾（$）
  exclude_context_patterns:
    - 'LOG_[A-Z]+\s*\($'

  # 扫描输出报告（UTF-8纯文本）
  output_report: ./scan_result.txt

# 生成字体配置
generate:
  # 用于生成中文数组的 profile 名称
  chinese_profile_name: chinese_fonts

  # 中文索引编码方式，必须与 WouoUI_font.h 中启用的 CNCodeIndexType 定义保持一致
  # 可选: utf-8, gb2312
  chinese_encoding: utf-8

  # 字体文件夹路径 (相对于脚本所在目录)
  font_folder: ../font

  # 生成的C文件输出路径
  output_c_folder: ../Csource/font

  # 字体数组格式配置
  font_format:
    # 排列方式: column_row = 先列后行 (列行式), row_column = 先行后列 (行列式)
    layout: row_column
    
    # 比特顺序: lsb = 最低位在前 (LSB), msb = 最高位在前 (MSB)
    bit_order: lsb
    
    # 编码方式: positive = 亮点为1 (阳码), negative = 亮点为0 (阴码)
    encoding: positive
    
    # 字符间距配置 - 全局默认值（profile中可选覆盖）
    default_char_spacing:
      # 左侧padding（像素数）
      left_pad: 1
      # 右侧padding（像素数）
      right_pad: 1
      # 是否居中对齐窄字符 (true = 居中, false = 左对齐)
      center_align: true

  # 字体规格profile配置
  # 允许不同的字体源使用不同的尺寸组合
  # 每个profile定义了该组字体使用的尺寸和font_paths
  # 支持单个文件或文件夹（文件夹会自动扫描所有.ttf和.bdf文件）
  profiles:
    chinese_fonts:               # 中文字体
      font_paths:
        - ../font/ZLabsBitmap_12px_ttf/ZLabsBitmap_12px_CN.ttf
      sizes: [12, 16, 24]
    
    monospace_fonts:             # 等宽字体
      font_paths:
        - ../font/Terminus/
      sizes: [8, 12, 16]
    
    unicode_fonts:               # Unicode字体 
      font_paths:
        - ../font/unifont/unifont-16_0_04.ttf
      sizes: [12, 16]

    Small_fonts:                 # 小尺寸字体
      font_paths:
        - ../font/04b_03/04B_03__.TTF
      sizes: [6, 8, 12]

  # 字符集配置
  charset:
    # ASCII 范围: 32-126 (共95个可打印字符)
    ascii_start: 32
    ascii_end: 126

# 预览配置
preview:
  # 是否开启预览功能
  enabled: false
  
  # 是否输出矩阵数组到控制台（使用 # 和空格表示）
  print_output: true
  
  # 预览展示的字符串
  text: "WQghH123我"

# ICON生成配置
icon:
  # ICON输出目录（相对于 Scripts 目录）
  output_c_folder: ../Csource/font

  # 输出文件名（将生成 <output_file_name>.c/.h）
  output_file_name: IconAssets

  # 统一ICON尺寸
  width: 30
  height: 30

  # 图片二值化阈值（0-255，越大越容易变黑）
  image_threshold: 128

  # 图片来源（支持多个路径，路径相对于 Scripts 目录）
  image_paths:
    # - ../Image/*.bmp
    - ../Image/UI.bmp
    - ../Image/设置.bmp
    - ../Image/Curves.bmp
    - ../Image/lock.bmp
    - ../Image/Page.bmp
    - ../Image/f-about.bmp

  # 图标字体来源（支持Nerd Font等）
  icon_fonts:
    - font_path: ../font/Terminus/TerminessNerdFont-Bold.ttf
      size: 30
      icons:
        - name: nf_home
          codepoint: "F015"
        - name: nf_terminal
          codepoint: "F120"
        - name: nf_gear
          char: ""
        - name: nf_search
          codepoint: "F002"
        - name: nf_folder
          codepoint: "F07B"
    - font_path: ../font/Terminus/TerminessNerdFont-Regular.ttf
      size: 30
      icons:
        - name: nf_music
          codepoint: "F001"
        - name: nf_camera
          codepoint: "F030"
        - name: nf_lock
          codepoint: "F023"
        - name: nf_wifi
          codepoint: "F1EB"
    - font_path: ../font/Terminus/TerminessNerdFontMono-Regular.ttf
      size: 30
      icons:
        - name: nf_bell
          codepoint: "F0F3"
        - name: nf_download
          codepoint: "F019"
        - name: nf_upload
          codepoint: "F093"
        - name: nf_check
          codepoint: "F00C"
    - font_path: ../font/Terminus/TerminessNerdFontPropo-Regular.ttf
      size: 30
