# WouoUI 字体转换配置文件
# Font Conversion Configuration

# 扫描配置 (暂时保留)
scan:
  # 这里预留扫描脚本的配置项
  # 后续扩展: scan_paths, include_exts, exclude_paths, output_report 等

# 生成字体配置
generate:
  # 字体文件夹路径 (相对于脚本所在目录)
  font_folder: ../font

  # 生成的C文件输出路径
  output_c_folder: ../Csource/font

  # 字体数组格式配置
  font_format:
    # 排列方式: column_row = 先列后行 (列行式), row_column = 先行后列 (行列式)
    layout: row_column
    
    # 比特顺序: lsb = 最低位在前 (LSB), msb = 最高位在前 (MSB)
    bit_order: lsb
    
    # 编码方式: positive = 亮点为1 (阳码), negative = 亮点为0 (阴码)
    encoding: positive

  # 预定义的字体大小 (字体高度，宽度根据字符集自动计算)
  # 这些尺寸会为每个字体生成，并放在同一个.c和.h文件中
  font_sizes:
    default:
      - 12
      - 16
      - 24

  # 字符集配置
  charset:
    # ASCII 范围: 32-126 (共95个可打印字符)
    ascii_start: 32
    ascii_end: 126

# 预览配置
preview:
  # 是否开启预览功能
  enabled: true
  
  # 是否输出矩阵数组到控制台（使用 # 和空格表示）
  print_output: true
  
  # 预览展示的字符串
  text: "WQghH123我"

