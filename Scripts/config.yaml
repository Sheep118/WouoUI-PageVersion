# WouoUI 字体转换配置文件
# Font Conversion Configuration

# 扫描配置 (暂时保留)
scan:
  # 这里预留扫描脚本的配置项
  # 后续扩展: scan_paths, include_exts, exclude_paths, output_report 等

# 生成字体配置
generate:
  # 字体文件夹路径 (相对于脚本所在目录)
  font_folder: ../font

  # 生成的C文件输出路径
  output_c_folder: ../Csource/font

  # 字体数组格式配置
  font_format:
    # 排列方式: column_row = 先列后行 (列行式), row_column = 先行后列 (行列式)
    layout: row_column
    
    # 比特顺序: lsb = 最低位在前 (LSB), msb = 最高位在前 (MSB)
    bit_order: lsb
    
    # 编码方式: positive = 亮点为1 (阳码), negative = 亮点为0 (阴码)
    encoding: positive

  # 预定义的字体大小 (不同大小的字体)
  # 可根据需要添加更多尺寸
  font_sizes:
    default:
      - 12
      - 16
      - 24

  # 字符集配置
  charset:
    # ASCII 范围: 32-126 (共95个可打印字符)
    ascii_start: 32
    ascii_end: 126

  # 图像缩放和二值化配置
  scaling:
    # 下采样 (缩小) 配置
    downscale:
      # 插值算法: NEAREST, BILINEAR, BICUBIC, LANCZOS
      # LANCZOS: 最高质量，保留细节（推荐缩小时使用）
      # BICUBIC: 中等质量，速度较快
      # BILINEAR: 快速，质量一般
      # NEAREST: 最快，但会丢失细节
      algorithm: LANCZOS
      
      # 二值化阈值 (0-255)
      # LANCZOS/BICUBIC 会产生灰度值，使用阈值转换为黑白
      # 推荐值: 100-130
      threshold: 120
    
    # 上采样 (放大) 配置
    upscale:
      # 插值算法: NEAREST 保持锐利边缘（推荐放大时使用）
      algorithm: NEAREST
      
      # 二值化阈值 (0-255)
      # NEAREST 产生的仍是黑白，但为了一致性也保留阈值配置
      # 推荐值: 80
      threshold: 0

# 预览配置
preview:
  # 是否开启预览功能
  enabled: true
  
  # 是否输出矩阵数组到控制台（使用 # 和空格表示）
  print_output: true
  
  # 预览展示的字符串
  text: "Hello WouoUI ghH123" 
